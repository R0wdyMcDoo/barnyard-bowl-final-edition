const LBO={db:null,uid:null,can:null,ready:false,sent:{},pending:{},busy:false,err:''};
const lbInt=v=>Math.max(0,Math.min(99999,Math.floor(+v||0))),lbStr=(x,n)=>String(x==null?'':x).replace(/[^A-Za-z0-9 .'!&\-]/g,'').toUpperCase().slice(0,n);
const lbEntry=()=>({n:lbStr(T.coach&&T.coach.n,16)||'COACH',t:lbStr(T.team&&T.team.n,24),v:lbMine().map(lbInt),s:Date.now()});
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);LBO.db=db||null;if(db&&user){LBO.uid=await user.id();LBO.can=await user.can('data.write')}}}catch(e){}

async function lbFlush(){if(LBO.busy)return;LBO.busy=true;
 try{while(Object.keys(LBO.pending).length){const pid=Object.keys(LBO.pending)[0],q=LBO.pending[pid];delete LBO.pending[pid];const ref=LBO.db.doc('lb/'+LBO.uid);
   try{await ref.update({coaches:{[pid]:q.e},t:Date.now()})}catch(err){await ref.set({coaches:{[pid]:q.e},t:Date.now()})}
   LBO.sent[pid]=q.sig;LBO.err=''}}
 catch(err){LBO.pending={};if(err&&err.code==='invalid_argument')LBO.can=false;else LBO.err='COULD NOT POST YOUR SCORE'}

async function lbRemove(pid){if(!pid||!LBO.db||!LBO.uid||LBO.can===false)return;try{const ref=LBO.db.doc('lb/'+LBO.uid),sn=await ref.get();if(!sn.exists)return;const d=sn.data()||{},c=Object.assign({},d.coaches||{});if(!(pid in c))return;delete c[pid];await ref.set({coaches:c,t:Date.now()});delete LBO.sent[pid]}catch(e){}}

let last=0;

function smoothDamp(cur,target,vel,st,max,dt){const om=2/st,x=om*dt,ex=1/(1+x+.48*x*x+.235*x*x*x);let ch=cur-target;const mx=max*st;ch=Math.max(-mx,Math.min(mx,ch));const tg=cur-ch,tmp=(vel+om*ch)*dt;vel=(vel-om*tmp)*ex;let out=tg+(ch+tmp)*ex;if((target-cur>0)==(out>target)){out=target;vel=dt>0?(out-target)/dt:0}return[out,vel]}
